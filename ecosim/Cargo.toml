[package]
name = "ecosim"
description = "Economy simulation"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
clap = { version = "4.6.7", features = ["derive"] }
ecosim-traits = { version = "0.2.0", path = "../ecosim-traits" }
env_logger = "0.11.11"
nanoid = "0.5.0"
rand = "0.10.3"
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
    "fmt",
    "env-filter",
    "std",
    "ansi",
] }
uuid = { version = "1.26.1", features = ["v4"] }
